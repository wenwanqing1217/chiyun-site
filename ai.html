<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1526">
<title>炽云算力 · 业务答疑</title>
<style>
  :root{
    --ink:#0f172a; --sub:#64748b; --line:#e8ecf3; --bg:#f4f6fb;
    --brand:#2563eb; --brand2:#06b6d4; --bubble:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  }
  /* 桌面端：做成居中的一张卡片；手机端：全屏 */
  @media (min-width:760px){
    html{
      display:flex;align-items:center;justify-content:center;
      background:
        radial-gradient(1100px 560px at 18% 0%,#e8efff 0%,transparent 62%),
        radial-gradient(900px 480px at 92% 100%,#e4fbff 0%,transparent 58%),
        #f2f5fb;
    }
    body{
      width:min(768px,92vw);height:min(860px,92dvh);border-radius:24px;overflow:hidden;
      background:#fff;border:1px solid #e3e9f4;
      box-shadow:0 28px 70px rgba(15,23,42,.14),0 2px 6px rgba(15,23,42,.04);
    }
    .bubble{max-width:70%}
  }
  body.embed{width:100%!important;height:100dvh!important;border:0!important;border-radius:0!important;box-shadow:none!important;max-width:none!important}
  body.bare header{display:none}
  body.bare main{padding-top:12px}
  /* 顶部 */
  header{
    background:linear-gradient(135deg,#0d1526 0%,#13203a 55%,#0f2a45 100%);
    color:#fff;padding:16px 18px 14px;position:relative;overflow:hidden;flex:0 0 auto;
  }
  header::after{
    content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,rgba(37,99,235,.55),transparent 65%);
  }
  .brand{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
  .logo{
    width:34px;height:34px;border-radius:10px;flex:0 0 auto;
    background:linear-gradient(135deg,#3b82f6,#06b6d4);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;
    box-shadow:0 6px 16px rgba(37,99,235,.35);
  }
  .brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.5px}
  .brand p{margin:1px 0 0;font-size:11.5px;color:#9fb3d1;letter-spacing:.4px}
  .badge{
    margin-left:auto;font-size:11px;color:#bfe3ff;border:1px solid rgba(120,180,255,.35);
    padding:4px 9px;border-radius:20px;background:rgba(59,130,246,.12);white-space:nowrap;z-index:1;
  }
  /* 聊天区 */
  main{
    flex:1;overflow-y:auto;padding:16px 14px 8px;
    scroll-behavior:smooth;-webkit-overflow-scrolling:touch;min-height:0;
  }
  .msg{display:flex;margin-bottom:14px;animation:rise .28s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg.me{justify-content:flex-end}
  .avatar{
    width:30px;height:30px;border-radius:50%;flex:0 0 auto;margin-right:8px;
    background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  }
  .bubble{
    max-width:82%;background:var(--bubble);border:1px solid var(--line);
    border-radius:16px 16px 16px 4px;padding:12px 14px;
    box-shadow:0 2px 8px rgba(15,23,42,.04);
  }
  .msg.me .bubble{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:0;
    border-radius:16px 16px 4px 16px;box-shadow:0 6px 18px rgba(37,99,235,.25);
  }
  .bubble h3{margin:0 0 6px;font-size:13.5px;color:var(--brand);font-weight:700}
  .bubble p{margin:0;white-space:pre-wrap;word-break:break-word}
  .bubble p + h3{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  .src{
    display:inline-block;margin-top:9px;font-size:11px;color:var(--sub);
    background:#f1f5fb;border-radius:6px;padding:3px 8px;
  }
  .nodata{color:var(--sub)}
  .more{color:var(--brand);text-decoration:none;font-weight:600}
  .bubble strong{font-weight:700}
  .bubble ul{margin:6px 0 0;padding-left:18px}
  .bubble li{margin:2px 0}
  .quote{margin:6px 0 0;padding:8px 12px;background:#f6f8fd;border-left:3px solid #c7d7f5;border-radius:0 8px 8px 0}
  .quote p{margin:0;color:#42526b;font-size:14px}
  .tblwrap{overflow:auto;max-height:300px;border:1px solid var(--line);border-radius:10px;margin-top:6px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:6px 9px;text-align:left;white-space:nowrap}
  th{background:#f5f8ff;position:sticky;top:0;font-weight:600;color:#1e3a8a}
  .retry{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  /* 快捷问题 */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;font-size:13px;color:#1e40af;background:#eef4ff;
    border:1px solid #dbe6ff;border-radius:20px;padding:7px 14px;cursor:pointer;
    transition:transform .16s ease,background .16s ease,box-shadow .16s ease;
  }
  .chip:hover{background:#e2ecff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.12)}
  .chip:active{transform:scale(.97);background:#dbe8ff}
  /* 输入栏 */
  footer{
    position:sticky;bottom:0;background:rgba(255,255,255,.92);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .bar{display:flex;gap:8px;align-items:center}
  input{
    flex:1;border:1px solid var(--line);background:#f7f9fd;border-radius:22px;
    padding:11px 16px;font-size:15px;outline:none;color:var(--ink);
    transition:border-color .2s,background .2s;
  }
  input:focus{border-color:#9dbbff;background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.1)}
  .send{
    width:44px;height:44px;border-radius:50%;border:0;flex:0 0 auto;cursor:pointer;
    background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(37,99,235,.28);
    transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;
  }
  .send:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(37,99,235,.36);filter:saturate(1.1)}
  .send:active{transform:scale(.94)}
  .send svg{width:19px;height:19px}
  .contact{
    text-align:center;font-size:12px;color:var(--sub);margin-top:8px;
  }
  .contact a{color:var(--brand);text-decoration:none;font-weight:600}
  .typing{display:inline-flex;gap:4px;padding:4px 2px}
  .typing i{width:6px;height:6px;border-radius:50%;background:#b6c6e3;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  @media (min-width:760px){
    main{min-height:60vh}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">智</div>
    <div>
      <h1>炽云算力 · 业务答疑</h1>
      <p>资料原文直答 · 不编造 · 可转人工</p>
    </div>
    <div class="badge">在线</div>
  </div>
</header>

<main id="chat">
  <div class="msg">
    <div class="avatar">智</div>
    <div class="bubble">
      <p>你好，这里是炽云算力业务答疑。价格、机型、计费、上机问题都可以直接问，我按内部资料原文回答。</p>
    </div>
  </div>
</main>

<div class="chips" id="chips">
  <div class="chip">4090多少钱</div>
  <div class="chip">怎么计费</div>
  <div class="chip">能开发票吗</div>
  <div class="chip">数据安全怎么保障</div>
  <div class="chip">支持哪些卡型</div>
  <div class="chip">场地在哪</div>
</div>

<footer>
  <div class="bar">
    <input id="q" placeholder="输入你的问题…" autocomplete="off">
    <button class="send" id="go" aria-label="发送">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
  <div class="contact">没找到答案，<a href="https://work.weixin.qq.com/ca/cawcde90eff79aef43" target="_blank" rel="noopener">加企业微信直接问</a></div>
</footer>

<script>
const DATA = [{"t":"一句话","x":"深圳市炽云人工智能有限公司，在深圳龙岗平湖做「AI-OPC 孵化器」：一套 GPU 算力底座，上面跑三层生意——AI 工具超市、算力租赁、弹性 GPU；楼下还有自有园区物业，算力、办公、安居一体化。\n\n- 对外品牌：**炽云AI · AI-OPC 孵化器**\n- 定位：GPU 算力底座 + 算力服务 + AI 工具 + 企业孵化的产业运营平台\n- 不自购 GPU、不自研模型，以炽云品牌整合上游算力与已备案模型能力","s":"01_公司介绍"},{"t":"基本底盘","x":"| 项目 | 数据 |\n|---|---|\n| 产业园 | 平湖 9 个园区，合计约 10 万㎡ 存量载体（厂房＋写字楼） |\n| 现有现金流 | 物业运营月稳定净利润约 50 万元 |\n| 办公载体 | 中国电子大楼 2—4 楼 OPC 孵化器，72—800㎡，可分割最小 30㎡，办公仓储两用 |\n| 配套公寓 | 瑞盛公寓单间约 2080 元/月，家私齐全，可作员工宿舍 |\n| 交通 | 深圳地铁 10 号线华南城站，步行约 300 米 |\n| 服务半径 | 深圳本地可上门；外地远程交付 |","s":"01_公司介绍"},{"t":"三层业务","x":"| 层级 | 业务 | 服务谁 | 卖什么 | 计费 |\n|---|---|---|---|---|\n| L1 | AI 工具超市 | 中小商家 | AI 绘图、数字人、文档解析、营销文案 | 订阅 + 按次调用 |\n| L2 | 算力包 | AI 短视频作坊、生图电商 | 算力 + AI 视频工具打包 | 按卡按时，开机计费、关机停费 |\n| L3 | 弹性 GPU | AI 创业公司 | 池化 GPU、多租户隔离 | 秒级计量、1 卡起租 |\n\n三层共用统一用户体系、计费账户与 API 网关。","s":"01_公司介绍"},{"t":"算力底座：共绩（算了么平台）","x":"炽云的算力业务**深度绑定共绩科技**——国内规模领先的算力调度平台。我们是其签约渠道与深圳本地服务方，客户用的就是同一套平台：\n\n- 70 万台设备算力池，SLA ≥ 99.99%\n- 自研 Rust 调度内核，\"电网式\"调峰填谷，按秒计费、关机停费\n- 异构接入率 94%，NVIDIA 全系 + 昇腾 / 海光 / 昆仑芯 / 摩尔线程统一纳管\n- 多租户隔离：Namespace / RBAC 隔离，AES-256 静态加密，TLS 1.3 传输，审计日志 180 天以上\n- 政府背书：多个省级算力调度平台承建方\n\n我们负责：选型、环境部署、本地支持与售后对接。算力资源与履约由共绩平台提供，我们做的是让客户\"选对、装好、有人管\"。备选上游还有优刻得（优云智算）等，可按需切换。","s":"01_公司介绍"},{"t":"硬件与产品能力","x":"- 覆盖 NVIDIA 全系：RTX 4090 / 5090、L20、L40、L40S、A100、A800、H20、H800、H100、H200、PRO6000 系列\n- 覆盖国产信创：昇腾 910B2 / 910C、海光 BW1000、昆仑芯 P800、摩尔线程 S4000\n- 三种交付形态：弹性部署（按卡按秒）、Job 批处理（含抢占）、裸金属整机（8 卡独享）\n- 另有：大模型 API（国内 7 款）、海外模型 API、对象存储/共享存储","s":"01_公司介绍"},{"t":"联系方式","x":"- 业务联系：项目总经理 龚伟　13428978692（对外统一由他对接）\n- **公司地址**：深圳市龙岗区平湖华南城 中国电子商务办公大楼 2 楼\n- **孵化器办公范围**：同园区楼栋 2—4 楼（园区口径也写作\"中国电子大楼 2—4 楼\"）\n- 地铁：10 号线华南城站，步行约 300 米\n- 对公收款，可开增值税专用发票","s":"01_公司介绍"},{"t":"对外表述边界","x":"- 算力底座与履约由共绩平台提供，炽云是签约渠道与本地服务方；不承诺\"绝对不宕机\"\"百分百拿到补贴\"。\n- 价格统一按 98 折口径，一律用\"约 / 起 / 最高\"，不报死价；具体以当期报价单与合同为准。\n- 法定代表人不参与日常业务对接，客户一律找业务联系人。","s":"01_公司介绍"},{"t":"六大产品线","x":"| 产品线 | 数量 | 计价单位 | 适用谁 |\n|---|---|---|---|\n| 裸金属整机 | 22 款机型 | 元/台（8 卡整机独享） | 需要稳定独占、长期跑训练/批量任务的客户 |\n| 弹性部署 | 22 款 GPU | 元/卡/小时 | 1 卡起租，按秒计费，关机停费 |\n| Job 批处理 | 8 款 GPU | 元/卡/小时 | 可中断的批量任务，抢占约按量 6 折 |\n| 大模型 API | 7 款国内模型 | 元/百万 tokens | 直接调 API，不碰服务器 |\n| 海外模型 API | 16 款（Claude / GPT / Gemini） | 元/百万 tokens | 海外主体、离岸项目 |\n| 存储 | 3 类 | 元/GB/月 | 与计算解耦，按量结算 |\n\n共 78 款产品、185 个报价条目。\n\n> 所有算力产品跑在共绩（算了么）平台上：70 万台设备池、SLA ≥ 99.99%、自研 Rust 调度、按秒计费、异构统一纳管。我们在其之上做选型、交付与本地服务。","s":"02_产品线与计费"},{"t":"四种计费形态怎么选","x":"**弹性部署（最灵活）**\n- 1 卡起租，按秒计量，关机即停止计费，0 空闲不花钱。\n- 适合：短时跑图、验证环境、临时推理、项目制短任务。\n- 月参考价按 730 小时折算，但按月不停机跑并不划算，长跑应选整机包。\n\n**Job 批处理（最便宜）**\n- 按量实例稳定独占；抢占实例约为按量 6 折，但**可能被回收**，只适合能中断的任务。\n- 适合：跑数据集、批量出图、离线推理、模型评测。\n\n**裸金属整机（最稳）**\n- 8 卡整机独享，按台计价，有时租 / 24 小时 / 7 天 / 30 天四档，包期越长单价越低。\n- 适合：多卡训练、长期推理服务、对稳定性要求高的生产环境。\n\n**大模型 API（最省事）**\n- 统一 Key 接入，按百万 tokens 计费，无订阅费、无最低消费。\n- 适合：做应用、不想管卡和环境的团队。","s":"02_产品线与计费"},{"t":"计费口径","x":"- GPU 与裸金属：按官网标准价 98 折执行（即本报价）。\n- 国内大模型：标准价 98 折。\n- 海外模型：官方价 9 折（旗舰）/ 8.5 折（走量），按汇率 7.2 折算。\n- 存储：镜像仓库 0.245 元/GB/月；对象存储加速 0.147＋0.147；共享存储卷 0.196＋0.147＋0.196 元/GB/月。\n- 所有价格**不含税**，最终以双方签署合同为准。","s":"02_产品线与计费"},{"t":"报价有效期与议价","x":"- 2026 年 11 月版报价单有效期至 **2026 年 12 月 31 日**。\n- 可另议的情况：长期包 90 天以上、整机 2 台以上、专线与私有化方案。\n- 结算：支持对公转账与月结，月结账期以合同约定为准；可开增值税专用发票。\n- 新客政策：首单 8 折（限时活动口径，具体以当期政策为准）。","s":"02_产品线与计费"},{"t":"增值服务","x":"- 环境部署：CUDA / cuDNN / PyTorch / SD / Flux / ComfyUI 远程安装调试，100 元/次起（复杂场景 100—300 元）。\n- 模型微调、推理优化、一站式 AI 方案：按项目报价。\n- 深圳本地可上门。","s":"02_产品线与计费"},{"t":"交付时效","x":"- 弹性实例：一般 10 分钟内开通。\n- 整机/特殊镜像（如 Windows）：需提前确认档期与镜像，可能等待。\n- 支持 SSH、Jupyter、VS Code 远程连接。","s":"02_产品线与计费"},{"t":"价格表（2026 年 11 月版）","x":"> 口径：元/卡/小时（弹性、Job）、元/台（裸金属 8 卡整机）、元/百万 tokens（API）、元/GB/月（存储）。\n> 全部**不含税**，按官网标准价 98 折执行；报价有效期至 2026 年 12 月 31 日，官方价格调整时按签约当日官网价 98 折执行，最终以合同为准。\n> 对外只报\"约/起/最高\"，不报死价；批量、长租、整机 2 台以上可另议。","s":"03_价格表"},{"t":"弹性部署（元/卡/小时，按秒计费，关机停费）","x":"| GPU | 显存 | 价格 | 单卡月参考（730h） |\n|---|---|---|---|\n| RTX 4090 | 24GB | 1.94 | 1416 |\n| RTX 4090 | 48GB | 2.96 | 2161 |\n| RTX 5090 | 32GB | 3.19 | 2329 |\n| L20 | 48GB | 3.92 | 2862 |\n| 兼容 |","s":"04_GPU选型与服务器配置"},{"t":"二、显存怎么估","x":"- 权重占用 ≈ 参数量 × 每参数字节数：FP16 约 2 字节，INT8 约 1 字节，INT4 约 0.5 字节。\n  - 7B FP16 ≈ 14GB；13B ≈ 26GB；70B FP16 ≈ 140GB（单卡放不下，需多卡或量化）。\n- 推理还要加 KV Cache，实际占用通常是权重的 1.2—1.5 倍，并发越高越多。\n- 微调看方式：LoRA 显存约为权重的 1.5—2 倍；全参微调要 4—8 倍，还要优化器状态。\n- 经验：**显存算完再留 20% 余量**，否则跑一晚就 OOM。","s":"04_GPU选型与服务器配置"},{"t":"三、整机内存与 CPU（客户常问）","x":"- 配比原则：**GPU 显存 : 系统内存 ≥ 1 : 4**。\n- 常见实配（以实际区域批次为准，报的是参考区间）：\n  - RTX 4090 整机：256—512GB DDR5 ECC，双路 Xeon\n  - RTX 5090 整机：约 512GB\n  - H20 整机：512GB—2TB\n  - H200 整机：约 2TB\n  - L20 / L40 / L40S：约 256GB，双路 Xeon\n  - 国产机型：部分为双路 ARM\n- 内存是参考区间，不是每台都一模一样；客户要求精确配置时，先确认档期与批次再承诺。","s":"04_GPU选型与服务器配置"},{"t":"四、几个必须说清的技术点","x":"1. **4090 / 5090 没有 NVLink**，多卡之间走 PCIe。多卡全参微调会被通信卡住，所以优先推荐 LoRA；真要全参就上 A800/H800。\n2. **国产卡不是 CUDA 生态**：昇腾走 CANN、海光走 DTK、昆仑芯/摩尔线程各有工具链。客户如果代码强依赖 CUDA 算子，要先评估迁移成本。\n3. **Windows 镜像要提前约**：整机默认 Linux；需要 Windows（如部分视频超分工具）必须下单前确认镜像与档期，临时提会等。\n4. **4090 48G 是改装卡**（原厂 24G），显存大但稳定性和售后风险略高，长期生产建议 5090 或专业卡。\n5. **存储与算力分开计费**：关机后计算不收费，但存储按 GB/月继续算；大文件记得清理。\n6. **抢占实例会被回收**：适合可中断任务，不能拿来做线上服务。\n7. **带宽另计**：大文件上传下载、对外提供服务要先确认带宽与端口策略。","s":"04_GPU选型与服务器配置"},{"t":"五、下单前必问六件事","x":"1. 任务类型：绘图 / 视频 / 推理 / 微调 / 训练 / 渲染？\n2. 模型多大、用什么框架（PyTorch、vLLM、ComfyUI、TensorFlow）？\n3. 数据量多大，怎么传（对象存储、直传、邮寄硬盘）？\n4. 租期：按小时、按天、按周还是按月？是否需要长期稳定？\n5. 是否需要 Windows 或特定镜像？\n6. 内存 / CPU 有没有硬性要求（如 ≥512G、指定 Xeon）？","s":"04_GPU选型与服务器配置"},{"t":"六、常见客户问题","x":"- **\"1 卡够不够？\"** 跑图、7B 量化推理、LoRA 小模型，1 卡够；70B 推理、全参微调，必须多卡。\n- **\"按秒计费怎么算？\"** 从开机到关机按实际秒数计，关机即停；存储单独按量算。\n- **\"和买卡比哪个划算？\"** 偶尔用、项目制、1—2 个月的，租更划算；天天满负荷跑几个月，买卡才回本。\n- **\"能跑 DeepSeek / Llama / Qwen 吗？\"** 开源模型都能跑，取决于参数量与显存；闭源模型走 API。\n- **\"数据安全吗？\"** 实例隔离、可选独立整机；敏感数据建议整机独享，不与他人共享节点。","s":"04_GPU选型与服务器配置"},{"t":"位置","x":"- **公司地址**：深圳市龙岗区平湖华南城 中国电子商务办公大楼 2 楼\n- **孵化器办公范围**：同园区楼栋 2—4 楼（园区口径也写作\"中国电子大楼 2—4 楼\"）\n- 地铁：10 号线华南城站，步行约 300 米\n- 自驾：近高速口，园区可停车\n- 周边：平湖 9 个产业园区，合计约 10 万㎡ 厂房＋写字楼","s":"05_场地与入驻"},{"t":"办公室","x":"| 项目 | 口径 |\n|---|---|\n| 面积 | 72—800㎡，可分割，最小约 30㎡ 独立隔间 |\n| 格局 | 现成 1+1 / 2+1 / 3+1，支持定制装修 |\n| 单价 | 35 元/㎡起（具体看楼层、朝向、装修） |\n| 用途 | 办公、仓储两用 |\n| 适合谁 | 一人公司（OPC）、AI 个体、跨境电商、小微初创团队 |\n\n> 30㎡ 的做法：现成最小户型 72㎡，可现场定制玻璃隔断隔出 30㎡ 独立隔间，符合消防要求，定制周期现场沟通。","s":"05_场地与入驻"},{"t":"配套公寓","x":"- 瑞盛公寓单间约 2080 元/月，家私齐全，拎包入住，可作员工宿舍。\n- 园区内解决\"办公 + 住宿\"，减少通勤。","s":"05_场地与入驻"},{"t":"入驻能拿到什么","x":"- 算力礼包：入驻企业可对接算力资源与专属价格。\n- 政策对接：协助申报深圳训力券等算力补贴（以当期政策为准，不承诺一定拿到）。\n- 生态：AI 工具、算力、上下游服务商在同一栋楼，方便对接。\n- 一站式：算力租赁 + 办公卡位 + 员工公寓打包。","s":"05_场地与入驻"},{"t":"招商常见问题","x":"- **有没有现成 30 平？** 现成最小 72㎡，可定制玻璃隔断隔出 30㎡ 独立隔间。\n- **能注册公司吗？** 可以，具体材料与地址证明按园区流程办理。\n- **租金能谈吗？** 看面积、租期与装修投入，长租可谈；开盘活动期有签约礼遇。\n- **公寓怎么租？** 单间 2080 元/月，家私齐全，园区内步行可达。\n- **能看场地吗？** 可以，深圳本地可约上门，地铁华南城站步行约 300 米。","s":"05_场地与入驻"},{"t":"你们比官网便宜吗？","x":"A：我们卖的不是最低价，是\"选对 + 装好 + 有人管\"。价格跟官网基本对齐（标准价 98 折），差别在服务：帮你判断该用哪张卡、环境预装好、出问题有人响应。单纯比单价，市面上永远有更低的。","s":"06_高频问答"},{"t":"为什么别家 1.7 元，你们 1.94 元？","x":"A：4090 弹性我们约 1.94 元/卡/小时，是 98 折后的价格。更低的报价常见于三种情况：限时活动、共享/超卖资源、或者不含环境和技术支持。价格差异主要在稳定性、是否独占和售后。","s":"06_高频问答"},{"t":"一次性买断和租哪个划算？","x":"A：偶尔用、项目制、1—2 个月的，租更划算；天天满负荷跑几个月，买卡才回本。可以先按天租跑通流程，再决定升不升级。","s":"06_高频问答"},{"t":"能便宜点吗？","x":"A：长期包 90 天以上、整机 2 台以上、专线或私有化方案可以另议。新客首单有限时折扣，具体以当期政策为准。","s":"06_高频问答"},{"t":"你们会不会跑路？","x":"A：可以看三样：营业执照、对公账户收款、与上游平台签署的合作协议。深圳本地欢迎上门看场地。所有款项走对公，不接受个人收款。","s":"06_高频问答"},{"t":"你们和共绩是什么关系？","x":"A：共绩是我们的算力底座，不是随便找的供应商。我们和共绩 2026 年 10 月签署渠道合作协议，客户用的就是同一套\"算了么\"平台：70 万台设备池、SLA 99.99%、按秒计费、异构调度、多租户隔离。深圳本地的选型、环境部署和售后由我们负责，算力就跑在这个平台上。","s":"06_高频问答"},{"t":"机器是你们自己的吗？","x":"A：服务器和调度平台是共绩的，我们的算力业务与共绩深度绑定，客户用的是同一套平台资源。我们负责交付和服务——选卡、装环境、本地支持，出问题我们兜到底。","s":"06_高频问答"},{"t":"出故障怎么办？","x":"A：先联系我们对接到技术，常见问题 10 分钟内响应；平台侧故障由上游处理，我们负责跟进到底。","s":"06_高频问答"},{"t":"我不懂技术，能用吗？","x":"A：不用懂。告诉我们你要做什么（生图、视频、训练、推理），我们配好环境和镜像，你直接跑。需要的话可以远程代部署，100 元/次起。","s":"06_高频问答"},{"t":"环境预装了什么？","x":"A：CUDA、cuDNN、PyTorch 等基础环境；按需预装 Stable Diffusion、Flux、ComfyUI、vLLM。支持 SSH、Jupyter、VS Code 远程连接。","s":"06_高频问答"},{"t":"多久能开通？","x":"A：弹性实例一般 10 分钟内；整机或特殊镜像（如 Windows）需确认档期，可能等待。","s":"06_高频问答"},{"t":"我的数据安全吗？","x":"A：实例之间隔离；敏感业务建议选整机独享，不与他人共享节点。我们不会查看、复制或外传客户数据。","s":"06_高频问答"},{"t":"能不能装我自己的模型/代码？","x":"A：可以，实例给你 root 权限，自己传代码和数据即可；需要长期保存的放共享存储或对象存储。","s":"06_高频问答"},{"t":"怎么付款？","x":"A：对公转账；也支持月结，账期以合同约定为准。个人收款一律不走。","s":"06_高频问答"},{"t":"能开发票吗？","x":"A：可以开增值税专用发票，税率按国家规定执行。","s":"06_高频问答"},{"t":"能签合同吗？","x":"A：可以，企业客户常规签服务合同；需要时提供报价单作为附件。","s":"06_高频问答"},{"t":"训力券怎么用？","x":"A：深圳训力券是给算力需求方的补贴额度，需求方每年最高 1000 万元租用额度，租卡可抵扣。我们跟进每一期申报窗口，协助做抵扣登记；具体能否获批、额度多少以政府当期政策为准。","s":"06_高频问答"},{"t":"入驻园区有什么优惠？","x":"A：入驻企业可对接算力礼包与政策申报；办公 35 元/㎡起，公寓单间约 2080 元，算力、办公、住宿可以打包谈。","s":"06_高频问答"},{"t":"你们有哪些大模型可以调？","x":"A：国内已备案模型 API 有 Kimi、GLM、DeepSeek、Qwen、腾讯混元等，按百万 tokens 计费，统一 Key 接入。开源模型可以部署到 GPU 上自己跑。","s":"06_高频问答"},{"t":"海外模型（Claude / GPT / Gemini）能用吗？","x":"A：我们有海外模型资源渠道，但只面向海外主体、离岸项目和隔离测试环境。境内公网业务按合规要求使用国内已备案模型。具体场景需要商务单独确认。","s":"06_高频问答"},{"t":"能帮我微调模型吗？","x":"A：可以。LoRA 微调用 4090/A800 就能做；全参微调要 A800/H800 多卡。按项目报价，先评估数据量和模型规模。","s":"06_高频问答"},{"t":"平台底座","x":"所有实例跑在共绩（算了么）平台上：按秒计费、关机停费、多租户隔离（Namespace / RBAC）、AES-256 静态加密、TLS 1.3 传输、审计日志 180 天以上，生产环境 SLA ≥ 99.99%。深圳本地的环境部署与排错由我们负责。","s":"07_上机与技术排错"},{"t":"上机流程","x":"1. 确认需求：任务类型、模型大小、数据量、租期、是否要 Windows、内存/CPU 要求。\n2. 选卡型：见《GPU 选型与服务器配置》。\n3. 开通：弹性实例一般 10 分钟内；整机与特殊镜像需确认档期。\n4. 连接：SSH / Jupyter / VS Code 远程。\n5. 交付：环境预装好，客户直接跑；需要时远程代部署。","s":"07_上机与技术排错"},{"t":"环境预装清单","x":"- 基础：CUDA、cuDNN、Python、PyTorch（版本可按需指定）\n- 绘图：Stable Diffusion、Flux、ComfyUI\n- 推理：vLLM（大模型高并发推理常用）\n- 其他：TensorFlow、FFmpeg（视频处理）","s":"07_上机与技术排错"},{"t":"常见故障与处理","x":"| 现象 | 常见原因 | 处理 |\n|---|---|---|\n| 显存溢出 OOM | 模型太大、batch 太大、并发太高 | 降 batch、用量化、换大显存卡或加卡 |\n| CUDA 版本不匹配 | 驱动与 PyTorch 版本不对应 | 按驱动版本选对应 torch 轮子，或换预装镜像 |\n| Jupyter / 端口打不开 | 服务只监听 127.0.0.1、未开端口 | 监听 0.0.0.0，确认端口与安全策略 |\n| 外网访问不了 | 带宽/端口策略限制 | 确认是否开放外网端口，必要时用内网或代理 |\n| Python 依赖装不上 | 源慢、版本冲突、缺系统库 | 换国内源；用虚拟环境隔离；补 apt 依赖 |\n| 模型加载失败 | 权重不完整、格式不对、显存不够 | 校验文件、确认精度、先小模型验证 |\n| 训练很慢 | 数据在低速盘、CPU 预处理瓶颈、无 NVLink | 数据放本地盘、加 dataloader 进程、多卡优先 LoRA |\n| 实例突然中断 | 用了抢占实例被回收 | 线上服务不要用抢占；改按量或整机 |","s":"07_上机与技术排错"},{"t":"计费与资源注意事项","x":"- 弹性按秒计费，**关机即停止计算计费**；但存储按 GB/月继续算，不用的大文件及时清。\n- 抢占实例约为按量 6 折，可能被回收，只适合可中断任务。\n- 整机包期越长越便宜，30 天包折合单卡时价约为时租的 83%。\n- 带宽、公网 IP、额外存储可能另计，下单前确认。\n- 长期任务建议先小样测试，再放量，避免跑一晚才发现配置不够。","s":"07_上机与技术排错"},{"t":"数据与备份","x":"- 实例本地盘适合临时数据，重要数据放共享存储或对象存储。\n- 释放实例前先备份，本地盘随实例释放。\n- 敏感数据建议整机独享，不与他人共享节点。","s":"07_上机与技术排错"},{"t":"客户补充问答（公开）","x":"> 由问题池补充，保存即生效。","s":"90_客户补充问答"},{"t":"Q：你们支持刷卡支付吗","x":"A：暂时不支持刷卡，只走对公转账；小额可以先按天试跑再签合同。\n\n> 补充于 2026-11-16","s":"90_客户补充问答"}];

function grams(s){
  const clean=(s||"").toLowerCase().replace(/[\s\p{P}\p{S}]+/gu,"");
  const out=new Set();
  for(let i=0;i<clean.length-1;i++) out.add(clean.slice(i,i+2));
  return out;
}
const INDEX=DATA.map(d=>({d,g:grams(d.t+d.x)}));

function search(q){
  const qg=grams(q);
  if(!qg.size) return [];
  const priceQ=/多少钱|价格|费用|报价|贵|便宜|计费/.test(q);
  const hits=[];
  for(const it of INDEX){
    let m=0;
    for(const g of qg) if(it.g.has(g)) m++;
    const cov=m/qg.size;
    if(cov<0.34) continue;
    let score=cov;
    if([...qg].some(g=>it.d.t.includes(g))) score+=0.12;
    if(priceQ && it.d.s.indexOf("价格表")>=0) score+=0.3;
    if(priceQ && /\d+\.\d+\s*元/.test(it.d.x)) score+=0.08;
    hits.push({s:score,d:it.d});
  }
  hits.sort((a,b)=>b.s-a.s);
  const seen=new Set();
  return hits.map(h=>h.d).filter(d=>{
    if(seen.has(d.t)) return false;
    seen.add(d.t); return true;
  }).slice(0,2);
}

function esc(s){
  return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function fmt(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
}

function mdBlocks(text){
  const lines=text.split("\n");
  let html="",rows=[],inTable=false,list=[],quote=[];
  const flushTable=()=>{
    if(!rows.length) return;
    const head=rows[0],body=rows.slice(1);
    html+='<div class="tblwrap"><table><thead><tr>'+
      head.map(c=>"<th>"+esc(c)+"</th>").join("")+
      "</tr></thead><tbody>"+
      body.map(r=>"<tr>"+r.map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>").join("")+
      "</tbody></table></div>";
    rows=[];
  };
  const flushList=()=>{
    if(!list.length) return;
    html+="<ul>"+list.map(x=>"<li>"+fmt(x)+"</li>").join("")+"</ul>";
    list=[];
  };
  const flushQuote=()=>{
    if(!quote.length) return;
    html+='<div class="quote">'+quote.map(x=>"<p>"+fmt(x)+"</p>").join("")+"</div>";
    quote=[];
  };
  for(const line of lines){
    const t=line.trim();
    if(t.startsWith("|")){
      flushList();
      const cells=t.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      if(cells.every(c=>/^:?-{2,}:?$/.test(c))) continue;
      rows.push(cells); inTable=true; continue;
    }
    if(inTable){ flushTable(); inTable=false; }
    if(t.startsWith(">")){ flushList(); quote.push(t.replace(/^>\s?/,"")); continue; }
    if(/^[-*]\s+/.test(t)){ flushList(); flushQuote(); list.push(t.replace(/^[-*]\s+/,"")); continue; }
    flushList(); flushQuote();
    if(t) html+="<p>"+fmt(t)+"</p>";
  }
  flushList(); flushQuote();
  if(inTable) flushTable();
  return html;
}

function add(html,me){
  const chat=document.getElementById("chat");
  const wrap=document.createElement("div");
  wrap.className="msg"+(me?" me":"");
  wrap.innerHTML=(me?"":'<div class="avatar">智</div>')+
    '<div class="bubble">'+html+'</div>';
  chat.appendChild(wrap);
  chat.scrollTop=chat.scrollHeight;
  return wrap;
}

function answer(q){
  add(esc(q),true);
  const typing=add('<span class="typing"><i></i><i></i><i></i></span>');
  setTimeout(()=>{
    const list=search(q);
    let html="";
    if(!list.length){
      html='<p class="nodata">资料里暂时没有这条的明确答案。可以换个问法，或者直接问人工。</p>'+
        '<div class="retry"><a class="src" href="https://work.weixin.qq.com/ca/cawcde90eff79aef43" target="_blank" rel="noopener">加企业微信</a></div>';
    }else{
      window.__full = list;
      html=list.map((d,i)=>{
        const hasTable=d.x.indexOf("|")>=0;
        let body;
        if(hasTable){
          body=mdBlocks(d.x);
        }else if(d.x.length>300){
          body='<p>'+fmt(d.x.slice(0,300))+'…<a href="javascript:;" class="more" data-i="'+i+'">展开全文</a></p>';
        }else{
          body=mdBlocks(d.x);
        }
        return '<h3>'+esc(d.t)+'</h3>'+body+'<span class="src">来源：'+esc(d.s)+'</span>';
      }).join("");
    }
    typing.querySelector(".bubble").innerHTML=html;
    const chat=document.getElementById("chat");
    chat.scrollTop=chat.scrollHeight;
  },320);
}

function run(){
  const el=document.getElementById("q");
  const q=el.value.trim();
  if(!q) return;
  el.value="";
  answer(q);
}
document.getElementById("go").onclick=run;
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")run();});
const P=new URLSearchParams(location.search);
if(P.get("embed")==="1") document.body.classList.add("embed");
if(P.get("bar")==="0") document.body.classList.add("bare");
document.addEventListener("click",e=>{
  const a=e.target.closest(".more");
  if(!a || !window.__full) return;
  const item=window.__full[+a.dataset.i];
  if(item) a.parentElement.outerHTML=mdBlocks(item.x);
});
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>answer(c.textContent.trim()));
</script>
</body>
</html>
