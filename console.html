<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>炽云AI · 工作台</title>
<style>
:root{--bg:#070b14;--card:#101827;--line:rgba(255,255,255,.08);--txt:#e8eefc;--dim:#8fa3c4;--blue:#2f7cff;--cyan:#19c8e6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 70% -10%,#12224a 0%,transparent 60%),var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;padding:40px 24px 60px}
.wrap{max-width:1080px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;font-weight:800;font-size:18px}
h1{font-size:20px;font-weight:700;letter-spacing:.5px}
.lv{margin-left:auto;font-size:12px;color:#9fd0ff;border:1px solid rgba(47,124,255,.35);background:rgba(47,124,255,.12);padding:5px 11px;border-radius:20px}
.out{font-size:12px;color:var(--dim);background:none;border:1px solid var(--line);border-radius:20px;padding:5px 11px;cursor:pointer;font-family:inherit}
.out:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.sub{color:var(--dim);font-size:13px;margin:6px 0 30px}
h2{font-size:12px;color:var(--dim);letter-spacing:2px;font-weight:600;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
a.card,div.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;text-decoration:none;color:var(--txt);transition:.2s}
a.card:hover{border-color:rgba(47,124,255,.5);transform:translateY(-2px);box-shadow:0 12px 30px -12px rgba(47,124,255,.5)}
.t{font-size:14.5px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.d{font-size:12.5px;color:var(--dim);line-height:1.6;word-break:break-all}
.tag{font-size:11px;font-weight:400;padding:1px 7px;border-radius:20px;background:rgba(47,124,255,.16);color:#8fb8ff;border:1px solid rgba(47,124,255,.25)}
footer{margin-top:36px;color:#5f7192;font-size:12px;text-align:center}
/* 登录 */
.login{max-width:380px;margin:14vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 24px 22px;box-shadow:0 30px 70px -30px rgba(0,0,0,.9)}
.login .logo{margin-bottom:14px}
.login h3{font-size:17px;font-weight:600;margin-bottom:6px}
.login p{font-size:12.5px;color:var(--dim);line-height:1.7;margin-bottom:18px}
.login input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:#0a1220;color:var(--txt);padding:0 14px;font-size:15px;outline:none;font-family:inherit}
.login input:focus{border-color:rgba(47,124,255,.6);box-shadow:0 0 0 4px rgba(47,124,255,.12)}
.login button{width:100%;height:44px;margin-top:12px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.login button:active{transform:scale(.99)}
.err{color:#ff8f8f;font-size:12.5px;margin-top:10px;min-height:16px}
.shake{animation:sk .3s}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="login" id="login">
    <div class="logo">炽</div>
    <h3>内部工作台</h3>
    <p>仅供公司内部使用。请输入访问口令。</p>
    <input id="pw" type="password" placeholder="访问口令" autocomplete="off">
    <button id="go">进入</button>
    <div class="err" id="err"></div>
  </div>

  <div id="app" class="hide">
    <header><div class="logo">炽</div><h1>炽云AI · 工作台</h1><span class="lv" id="lv"></span><button class="out" id="out">退出</button></header>
    <div class="sub">所有入口集中在这里，不用记路径。标「本机」的链接需要在公司电脑上打开。</div>
    <div id="body"></div>
    <footer>内部资料请勿外发</footer>
  </div>
</div>

const box=document.getElementById("login"),app=document.getElementById("app"),err=document.getElementById("err");

function hx(s){return Array.from(new Uint8Array(s)).map(b=>b.toString(16).padStart(2,"0")).join("")}
async function sha(x){return hx(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(x)))}
function h2b(h){const a=new Uint8Array(h.length/2);for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
async function unseal(blob,pw,salt){
  const raw=Uint8Array.from(atob(blob),c=>c.charCodeAt(0));
  let out=new Uint8Array(0),prev=pw+salt,i=0;
  while(out.length<raw.length){i++;prev=await sha(prev+"|"+i);const blk=h2b(prev);const n=new Uint8Array(out.length+blk.length);n.set(out);n.set(blk,out.length);out=n}
  const dec=new Uint8Array(raw.length);
  for(let k=0;k<raw.length;k++)dec[k]=raw[k]^out[k];
  return JSON.parse(new TextDecoder().decode(dec));
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(cfg,label){
  document.getElementById("lv").textContent=label;
  document.getElementById("body").innerHTML=cfg.map(sec=>
    '<h2>'+esc(sec.h)+'</h2><div class="grid">'+sec.items.map(it=>{
      const tag=it.tag?' <span class="tag">'+esc(it.tag)+'</span>':'';
      const inner='<div class="t">'+esc(it.t)+tag+'</div><div class="d">'+esc(it.d)+'</div>';
      return it.href?'<a class="card" href="'+esc(it.href)+'"'+(/^https?:/.test(it.href)?' target="_blank" rel="noopener"':'')+'>'+inner+'</a>':'<div class="card">'+inner+'</div>';
    }).join("")+'</div>').join("");
  box.classList.add("hide");app.classList.remove("hide");
}
async function login(pw){
  const h=await sha(pw);
  if(h===H1){sessionStorage.setItem("cy_pw",pw);render(await unseal(B1,pw,S1),"一级 · 管理");return true}
  if(h===H2){sessionStorage.setItem("cy_pw",pw);render(await unseal(B2,pw,S2),"普通员工");return true}
  err.textContent="口令不对，请重试";box.classList.add("shake");setTimeout(()=>box.classList.remove("shake"),320);return false;
}
document.getElementById("go").onclick=()=>{const v=document.getElementById("pw").value.trim();if(v)login(v)};
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter"){const v=e.target.value.trim();if(v)login(v)}});
document.getElementById("out").onclick=()=>{sessionStorage.removeItem("cy_pw");location.reload()};
if(!crypto.subtle){err.textContent="请通过 https 访问本站"}
else{const saved=sessionStorage.getItem("cy_pw");if(saved)login(saved)}
</script>
