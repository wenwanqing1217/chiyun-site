<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="炽云工作台">
<meta name="description" content="炽云AI内部工作台">
<meta name="robots" content="noindex,nofollow">
<title>炽云AI · 工作台</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/logo-mark.png">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<style>
@font-face{font-family:"Inter";src:url(/assets/fonts/Inter.woff) format("woff");font-weight:100 900;font-display:swap}
@font-face{font-family:"CY Sans";src:url(/assets/fonts/NotoSansSC-Regular.woff) format("woff");font-weight:300 400;font-display:swap}
@font-face{font-family:"CY Sans";src:url(/assets/fonts/NotoSansSC-Medium.woff) format("woff");font-weight:500;font-display:swap}
@font-face{font-family:"CY Sans";src:url(/assets/fonts/NotoSansSC-Bold.woff) format("woff");font-weight:600 900;font-display:swap}
:root{
  --paper:#05070d;--paper2:#090c16;--card:#0d1120;--ink:#f4f6fb;--ink2:#a8b0c4;--muted:#6b7389;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--accent:#5b8cff;--accent-soft:rgba(91,140,255,.14);--olive:#38d6f5;--olive-soft:rgba(56,214,245,.14);
  --red:#e06c6c;--amber:#e0b063;--green:#5fae7a;
  --serif:"Inter","CY Sans","PingFang SC","Microsoft YaHei",sans-serif;
  --sans:"Inter","CY Sans","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
html[data-theme="light"]{
  --paper:#f3f5fa;--paper2:#f8f9fd;--card:#ffffff;--ink:#12172a;--ink2:#454e66;--muted:#7b8299;
  --line:#e0e4ee;--line2:#c9cfdd;--accent:#3d6ce0;--accent-soft:#e6ecfc;--olive:#1f9fc4;--olive-soft:#e2f3f8;
  --red:#c04545;--amber:#a9762a;--green:#4d7c4f;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.boot{display:grid;place-items:center;height:100vh;color:var(--muted);font-family:var(--serif);letter-spacing:.12em}
.ch{display:inline-block;animation:blurIn .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes blurIn{from{opacity:0;filter:blur(9px);transform:translateY(7px)}to{opacity:1;filter:blur(0);transform:none}}
.rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- 登录 ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:28px 18px;background:var(--paper)}
.auth-card{width:100%;max-width:410px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:38px 32px 28px;position:relative}
.auth-card::before{content:"";position:absolute;left:-1px;top:-1px;width:46px;height:3px;background:var(--accent)}
.brand-mark{width:52px;height:52px;border-radius:4px;object-fit:contain;background:var(--paper2);border:1px solid var(--line);padding:5px}
.eyebrow{font-size:10.5px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase;font-weight:500}
.auth h1{font-family:var(--serif);font-size:25px;line-height:1.35;font-weight:500;margin:16px 0 8px;letter-spacing:.01em}
.auth-sub{font-size:12.5px;color:var(--muted);line-height:1.85;margin-bottom:24px}
.switch{display:flex;border-bottom:1px solid var(--line);margin-bottom:22px;gap:20px}
.switch button{border:0;background:none;padding:0 0 10px;color:var(--muted);font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.switch button.on{color:var(--ink);border-bottom-color:var(--accent)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--paper2);border:1px solid var(--line);border-radius:3px;padding:11px 12px;outline:none;transition:border-color .2s,box-shadow .2s}
.field input,.field select{height:44px}
.field textarea{min-height:100px;line-height:1.7;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{height:40px;border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:0 22px;font-size:13px;font-weight:500;letter-spacing:.02em;transition:all .25s;display:inline-flex;align-items:center;justify-content:center;gap:7px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.14),0 8px 24px -12px rgba(91,140,255,.45)}
.btn:hover{box-shadow:0 0 0 5px rgba(91,140,255,.14),0 10px 28px -10px rgba(91,140,255,.5);transform:translateY(-1px)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink2);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:transparent;box-shadow:none}
.btn.full{width:100%;margin-top:6px}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px}
.btn.danger{background:transparent;border-color:var(--line2);color:var(--red)}
.btn.danger:hover{background:var(--accent-soft)}
.auth-msg{color:var(--red);font-size:12.5px;min-height:18px;margin-top:10px}
.auth-note{font-size:11.5px;color:var(--muted);line-height:1.8;margin-top:22px;border-top:1px solid var(--line);padding-top:16px}

/* ---------- 登录屏 · 官网同款深蓝（官网 / 登录屏 / 工作台三处统一视觉） ---------- */
#auth{background:#05070d;color:#f4f6fb;overflow:hidden;position:relative}
#auth::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:56px 56px;pointer-events:none;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 75%)}
#auth::after{content:"";position:absolute;inset:0;background:radial-gradient(640px 320px at 50% -5%,rgba(91,140,255,.16),transparent 70%),radial-gradient(520px 260px at 50% 110%,rgba(91,140,255,.1),transparent 70%);pointer-events:none}
.a-wrap{position:relative;z-index:1;width:100%;max-width:432px;text-align:center;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
#auth .brand-mark{display:block;width:46px;height:46px;margin:0 auto 20px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.a-h1{font-size:clamp(27px,5vw,36px);font-weight:800;line-height:1.28;margin:0 0 10px;letter-spacing:.01em}
.a-gold{display:inline-block;background:linear-gradient(180deg,#a8c4ff 0%,#7aa2ff 38%,#5b8cff 72%,#38d6f5 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:blurIn .7s cubic-bezier(.2,.7,.2,1) .18s both}
.a-sub{color:#8a93a8;font-size:13.5px;line-height:1.9;margin:0}
.a-card{margin-top:28px;text-align:left;border:1px solid rgba(91,140,255,.3);border-radius:16px;padding:28px 26px 22px;background:linear-gradient(180deg,rgba(91,140,255,.07),rgba(255,255,255,.012))}
#auth .switch{display:flex;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:22px;gap:24px;justify-content:center}
#auth .switch button{border:0;background:none;padding:0 2px 10px;color:#8a93a8;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s}
#auth .switch button.on{color:#f4f6fb;border-bottom-color:#5b8cff}
#auth .field label{color:#8a93a8}
#auth .field input{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);color:#f4f6fb;border-radius:10px;height:46px}
#auth .field input::placeholder{color:#5c6478}
#auth .field input:focus{border-color:rgba(91,140,255,.65);box-shadow:0 0 0 3px rgba(91,140,255,.14)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:48px !important}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;cursor:pointer;color:#5c6478;border-radius:8px;transition:color .2s,background .2s}
.pw-eye:hover{color:#7aa2ff;background:rgba(255,255,255,.05)}
.pw-eye svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#auth .btn.full{background:linear-gradient(180deg,#fff,#dfe6f5);color:#05070d;border:0;border-radius:99px;height:48px;font-size:14.5px;font-weight:600;margin-top:10px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.15),0 10px 30px -10px rgba(140,170,255,.55)}
#auth .btn.full:hover{filter:none;box-shadow:0 0 0 6px rgba(255,255,255,.09),0 14px 36px -10px rgba(140,170,255,.7);transform:translateY(-1px)}
#auth .auth-msg{color:#e06c6c}
.a-note{color:#8a93a8;font-size:11.5px;line-height:2;margin-top:24px}
.a-note a{color:#7aa2ff;border-bottom:1px dashed rgba(91,140,255,.5)}
@media(max-width:480px){.a-card{padding:22px 18px 18px}}

/* ---------- 框架 ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;height:62px;padding:0 26px;background:var(--paper);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px}
.brand img{width:34px;height:34px;border-radius:3px;object-fit:contain;background:var(--card);border:1px solid var(--line);padding:3px}
.brand b{display:block;font-family:var(--serif);font-size:15px;font-weight:500;line-height:1.25}
.brand span{display:block;font-size:9.5px;letter-spacing:.16em;color:var(--muted)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border:1px solid transparent;border-radius:3px;background:none;color:var(--ink2);display:grid;place-items:center;position:relative}
.icon-btn:hover{border-color:var(--line);background:var(--paper2)}
.quit-btn{height:34px;padding:0 12px;margin-left:6px;border:1px solid var(--line);border-radius:3px;background:transparent;color:var(--ink2);font-size:12px;display:inline-flex;align-items:center;gap:6px;transition:border-color .2s,color .2s,background .2s}
.quit-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.quit-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;right:2px;top:2px;min-width:16px;height:16px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px;border:2px solid var(--paper)}
.who{font-size:12px;color:var(--muted);padding:0 6px;border-left:1px solid var(--line);margin-left:2px}
.who b{color:var(--ink);font-weight:500}
.layout{display:grid;grid-template-columns:216px 1fr;max-width:1320px;margin:0 auto;height:calc(100vh - 62px)}
.side{border-right:1px solid var(--line);padding:24px 14px;height:100%;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;overscroll-behavior:contain}
.side::-webkit-scrollbar{width:6px}
.side::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
.side::-webkit-scrollbar{display:none}
.main::-webkit-scrollbar{width:8px}
.main::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
.side .grp{font-size:10px;letter-spacing:.2em;color:var(--muted);padding:18px 12px 8px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:3px;font-size:13px;color:var(--ink2);cursor:pointer;margin-bottom:1px;transition:background .18s,color .18s}
.nav-item:hover{background:var(--paper2);color:var(--ink)}
.nav-item.on{background:var(--accent-soft);color:var(--accent)}
.nav-item .ni{opacity:.7;display:grid;place-items:center}
.nav-item.on .ni{opacity:1}
.nav-item .cnt{margin-left:auto;font-size:10.5px;color:var(--muted)}
.main{padding:30px 34px 90px;min-width:0;height:100%;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.tabbar{display:none}

/* ---------- 通用 ---------- */
.hd{display:flex;align-items:flex-end;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.hd .ht{flex:1;min-width:200px}
.hd h2{font-family:var(--serif);font-size:23px;font-weight:500;letter-spacing:.01em;line-height:1.35}
.hd p{font-size:12px;color:var(--muted);margin-top:3px}
.hd .sp{display:flex;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 19px;position:relative;transition:border-color .25s}
.spot{position:relative;overflow:hidden}
.spot::before{content:"";position:absolute;inset:0;background:radial-gradient(320px circle at var(--mx,50%) var(--my,0%),rgba(180,83,42,.075),transparent 62%);opacity:0;transition:opacity .4s;pointer-events:none}
.spot:hover::before{opacity:1}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.stat{padding:20px 20px 17px}
.stat .num{font-family:var(--serif);font-size:34px;line-height:1;font-weight:500;letter-spacing:-.02em}
.stat .lb{font-size:11px;letter-spacing:.1em;color:var(--muted);margin-top:9px}
.stat .sub{font-size:11px;color:var(--muted);margin-top:5px}
.stat .bar{height:2px;width:26px;background:var(--accent);margin-top:14px}
.meta{font-size:11.5px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;padding:2px 8px;border-radius:2px;background:var(--paper2);border:1px solid var(--line);color:var(--ink2);letter-spacing:.03em}
.pill.g{background:var(--olive-soft);border-color:transparent;color:var(--olive)}
.pill.w{background:var(--accent-soft);border-color:transparent;color:var(--amber)}
.pill.r{background:var(--accent-soft);border-color:transparent;color:var(--red)}
.pill.a{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.empty{color:var(--muted);font-size:12.5px;text-align:center;padding:44px 12px;border:1px dashed var(--line);border-radius:4px;font-family:var(--serif)}
.avatar{width:34px;height:34px;border-radius:2px;display:grid;place-items:center;font-family:var(--serif);font-size:14px;background:var(--paper2);border:1px solid var(--line2);color:var(--accent);flex:none}
.row{display:flex;gap:11px;align-items:flex-start}
.item-hd{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.item-hd .nm{font-size:13.5px;font-weight:500}
.txt{font-size:13px;line-height:1.85;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.txt.small{font-size:12px;color:var(--muted)}
.ln{height:1px;background:var(--line);margin:13px 0}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.link{color:var(--accent);word-break:break-all;font-size:12.5px;border-bottom:1px solid var(--line2)}
.chk{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border:1px solid var(--line);border-radius:3px;background:var(--card);cursor:pointer}
.chk:hover{border-color:var(--line2)}
.chk input{margin-top:4px;accent-color:var(--accent)}
.chk.done .t{text-decoration:line-through;color:var(--muted)}
.small-note{font-size:11.5px;color:var(--muted);line-height:1.7}
.thumb{width:100%;height:148px;object-fit:cover;border-radius:3px;background:var(--paper2);border:1px solid var(--line)}
.section-title{font-size:10.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;padding:2px 0 11px;border-bottom:1px solid var(--line);margin-bottom:13px}
.divider-line{height:1px;background:var(--line);margin:22px 0}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:0 0 10px;color:var(--muted);font-size:12.5px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.searchbar{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:3px;padding:0 12px;height:40px}
.searchbar input{border:0;background:none;outline:none;flex:1;height:100%}

/* 消息 */
.msg-layout{display:grid;grid-template-columns:250px 1fr;gap:14px;min-height:520px}
.msg-list{border:1px solid var(--line);border-radius:4px;background:var(--card);overflow:auto;max-height:600px}
.msg-peer{display:flex;gap:10px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.msg-peer:hover{background:var(--paper2)}
.msg-peer.on{background:var(--accent-soft)}
.msg-peer .nm{font-size:13px;font-weight:500}
.msg-peer .pv{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.msg-peer .dt{font-size:10.5px;color:var(--muted);margin-left:auto}
.msg-peer .un{background:var(--accent);color:#fff;border-radius:10px;font-size:10px;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 5px}
.msg-box{border:1px solid var(--line);border-radius:4px;background:var(--card);display:flex;flex-direction:column;min-height:520px}
.msg-hd{padding:14px 18px;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:15px}
.msg-feed{flex:1;overflow:auto;padding:18px;max-height:430px}
.mb{display:flex;margin-bottom:14px}
.mb.me{justify-content:flex-end}
.mb .b{max-width:78%;background:var(--paper2);border:1px solid var(--line);border-radius:4px;padding:9px 12px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.mb.me .b{background:var(--accent-soft);border-color:#e2c5b1;color:var(--ink)}
.mb .who{font-size:10.5px;color:var(--muted);margin-bottom:3px}
.msg-in{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px}
.msg-in textarea{flex:1;border:1px solid var(--line);background:var(--paper2);border-radius:3px;padding:10px 12px;resize:none;height:46px;outline:none}
.msg-in textarea:focus{border-color:var(--accent)}

/* 推广团队 */
.rank{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .no{width:22px;font-family:var(--serif);font-size:15px;color:var(--muted);text-align:center}
.rank .nm{flex:1;font-size:13px}
.rank .amt{font-family:var(--serif);font-size:16px;color:var(--accent)}
.agent-card{position:relative}
.agent-card .role{position:absolute;right:14px;top:14px}
.agent-card .tno{position:absolute;right:14px;top:14px;font-family:var(--mono,var(--serif));font-size:12.5px;letter-spacing:.08em;color:var(--ink2);background:var(--accent-soft);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.agent-card .role{top:42px}
.tno-inline{font-family:var(--mono,var(--serif));font-size:11px;letter-spacing:.05em;color:var(--muted);margin-left:6px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.kv .k{color:var(--muted)}

/* 弹层 */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:grid;place-items:center;padding:18px}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:4px;padding:26px 24px;position:relative}
.sheet::before{content:"";position:absolute;left:-1px;top:-1px;width:46px;height:3px;background:var(--accent)}
.sheet h3{font-family:var(--serif);font-size:19px;font-weight:500;margin-bottom:18px}
.sheet .foot{display:flex;gap:9px;margin-top:18px}
.sheet .foot .btn{flex:1}
.cmt{padding:12px 0;border-bottom:1px solid var(--line)}
.cmt:last-child{border-bottom:0}
.cmt .meta{margin-top:6px}
.doc-body{background:var(--paper2);border:1px solid var(--line);border-radius:3px;padding:17px;font-size:12.5px;line-height:1.9;white-space:pre-wrap;max-height:46vh;overflow:auto;color:var(--ink2)}

/* 平台嵌入 */
.plat-card{cursor:pointer;transition:border-color .2s,transform .15s}
.plat-card:hover{border-color:var(--accent)}
.plat-card:active{transform:scale(.99)}
.plat-ico{width:42px;height:42px;border:1px solid var(--line);border-radius:3px;display:grid;place-items:center;background:var(--paper2);color:var(--accent);flex:none}
.plat-view{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--card);margin-top:18px}
.plat-bar{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line);background:var(--paper2)}
.plat-bar .u{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.plat-frame{width:100%;height:70vh;min-height:460px;border:0;background:#fff;display:block}
.plat-tip{font-size:11px;color:var(--muted);padding:9px 13px;border-top:1px solid var(--line);background:var(--paper2)}

/* 通知项 */
.nitem{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .18s}
.nitem:hover{background:var(--paper2)}
.nitem.un{background:var(--accent-soft)}
.nitem .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px;flex:none}
.nitem .tt{font-size:13px;font-weight:500}
.nitem .cc{font-size:12px;color:var(--muted);margin-top:3px}
.nitem .tm{font-size:10.5px;color:var(--muted);margin-left:auto;white-space:nowrap}

@media(max-width:900px){
  .layout{grid-template-columns:1fr;height:auto}
  .side{display:none}
  .main{padding:22px 16px 104px;height:auto;overflow:visible}
  .tabbar{display:flex;overflow-x:auto;scrollbar-width:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:5px 3px calc(5px + env(safe-area-inset-bottom))}
  .tabbar::-webkit-scrollbar{display:none}
  .tabbar button{flex:1 0 auto;min-width:56px;border:0;background:none;color:var(--muted);font-size:10px;padding:6px 2px;display:flex;flex-direction:column;gap:3px;align-items:center;position:relative}
  .tabbar button.on{color:var(--accent)}
  .tabbar button .bd{position:absolute;right:12px;top:2px;background:var(--accent);color:#fff;font-size:9px;min-width:14px;height:14px;line-height:14px;border-radius:8px;padding:0 3px}
  .top{height:56px;padding:0 14px}
  .brand span{display:none}
  .hd h2{font-size:20px}
  .msg-layout{grid-template-columns:1fr}
  .msg-list{max-height:190px}
  .msg-box{min-height:400px}
  .msg-feed{max-height:330px}
  .sheet{max-height:92vh;padding:22px 18px}
}
@media(max-width:420px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .stat .num{font-size:29px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

const ico=(n,s=18)=>'<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(P[n]||'')+'</svg>';

async function api(path,opts){
  opts=opts||{};
  const init={credentials:'same-origin',headers:{'content-type':'application/json'},method:opts.method||'GET'};
  if(opts.body!==undefined) init.body=JSON.stringify(opts.body);
  let r;
  try{r=await fetch('/api/'+path,init)}
  catch(e){throw new Error('连不上数据服务，请检查网络后重试')}
  const ct=(r.headers.get('content-type')||'').toLowerCase();
  if(!ct.includes('json')) throw new Error('未接入数据服务（HTTP '+r.status+'）· 静态预览请从工作台正式入口登录');
  let d={};try{d=await r.json()}catch(e){throw new Error('返回数据异常')}
  if(!r.ok||d.ok===false) throw new Error(d.error||('请求失败 '+r.status));
  return d;
}
function fmtTime(s){
  if(!s) return '';
  const t=/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(s)?s.replace(' ','T')+'Z':s;
  const d=new Date(t);
  if(isNaN(d)) return s;
  const p=n=>String(n).padStart(2,'0');
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+p(d.getHours())+':'+p(d.getMinutes());
}
const todayStr=()=>new Date(Date.now()+8*3600*1000).toISOString().slice(0,10);
const initials=n=>String(n||'?').slice(0,1);
const kindIcon={message:'chat',approval:'approval',announcement:'news',customer:'briefcase',system:'info'};

const S={user:null,tab:'home',unread:0,chatWith:0,cache:{},installPrompt:null,theme:'dark'};

/* ---------- 日夜主题 ---------- */
(function initTheme(){
  const saved=localStorage.getItem('cy_theme')||'dark';

  document.documentElement.setAttribute('data-theme',saved);

/* ---------- 文本动效 ---------- */
function splitTitle(el){
  if(!el) return;
  const txt=el.textContent;
  el.innerHTML='';
  [...txt].forEach((c,i)=>{
    const s=document.createElement('span');
    s.className='ch';s.textContent=c===' '?'\u00a0':c;
    s.style.animationDelay=(i*26)+'ms';
    el.appendChild(s);
  });
}
function countUp(el,to){
  if(!el||!Number.isFinite(to)) return;
  const dur=850,st=performance.now();
  const step=t=>{
    const p=Math.min(1,(t-st)/dur);
    el.textContent=Math.round(to*(1-Math.pow(1-p,3)));
    if(p<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function bindEffects(root){
  root.querySelectorAll('.spot').forEach(c=>{
    c.addEventListener('mousemove',e=>{
      const r=c.getBoundingClientRect();
      c.style.setProperty('--mx',(e.clientX-r.left)+'px');
      c.style.setProperty('--my',(e.clientY-r.top)+'px');
    });
  });
  root.querySelectorAll('.btn').forEach(b=>{
    b.addEventListener('mousemove',e=>{
      const r=b.getBoundingClientRect();
      b.style.transform='translate('+((e.clientX-r.left-r.width/2)*.08)+'px,'+((e.clientY-r.top-r.height/2)*.12)+'px)';
    });
    b.addEventListener('mouseleave',()=>b.style.transform='');
  });
}

/* ---------- 登录 / 注册 ---------- */
function showAuth(){$('#boot').classList.add('hide');$('#app').classList.add('hide');$('#auth').classList.remove('hide');splitTitle($('#authTitle'))}

function formObj(f){const o={};new FormData(f).forEach((v,k)=>o[k]=String(v).trim());return o;}
$('#swLogin').onclick=()=>{$('#loginForm').classList.remove('hide');$('#regForm').classList.add('hide');$('#swLogin').classList.add('on');$('#swReg').classList.remove('on');$('#authMsg').textContent=''};
$('#swReg').onclick=()=>{$('#loginForm').classList.add('hide');$('#regForm').classList.remove('hide');$('#swReg').classList.add('on');$('#swLogin').classList.remove('on');$('#authMsg').textContent=''};
/* 密码可见切换（眼睛） */
document.querySelectorAll('#auth .field').forEach(f=>{
  const inp=f.querySelector('input[type="password"]');if(!inp)return;
  const w=document.createElement('div');w.className='pw-wrap';
  inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
  const b=document.createElement('button');b.type='button';b.className='pw-eye';b.setAttribute('aria-label','显示或隐藏密码');
  b.innerHTML='<svg viewBox="0 0 24 24"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16" style="display:none"/></svg>';
  w.appendChild(b);
  b.onclick=()=>{const show=inp.type==='password';inp.type=show?'text':'password';b.querySelector('.slash').style.display=show?'':'none'};
});
$('#loginForm').onsubmit=async e=>{
  e.preventDefault();$('#authMsg').textContent='';
  try{const d=await api('login',{method:'POST',body:formObj(e.target)});S.user=d.user;startApp()}
  catch(err){$('#authMsg').textContent=err.message}
};
$('#regForm').onsubmit=async e=>{
  e.preventDefault();$('#authMsg').textContent='';
  try{
    const d=await api('register',{method:'POST',body:formObj(e.target)});
    S.user=d.user;startApp();
    openSheet('<h3>开通成功</h3><div class="card" style="line-height:2.2">你的账号：<b style="letter-spacing:.08em">'+esc(d.username)+'</b><br>密码：你刚设置的密码</div>'+
      '<p class="small-note" style="margin-top:10px">请记下账号，下次用它登录；忘记密码可找管理员重置。</p>'+
      '<div class="foot"><button class="btn ghost" id="r_cp">复制账号</button><button class="btn" data-close>开始使用</button></div>',
      sh=>{
        sh.querySelector('[data-close]').onclick=closeSheet;
        sh.querySelector('#r_cp').onclick=()=>{navigator.clipboard.writeText(d.username);sh.querySelector('#r_cp').textContent='已复制'};
      });
  }catch(err){$('#authMsg').textContent=err.message}
};
$('#logoutBtn').onclick=async()=>{
  try{await api('logout',{method:'POST'})}catch(e){}
  S.user=null;showAuth();
};
$('#noticeBtn').onclick=()=>go('notifications');

/* ---------- 启动 ---------- */
async function boot(){
  try{const d=await api('me');S.user=d.user;startApp()}
  catch(e){showAuth()}
}
function startApp(){
  showApp();
  renderThemeBtn();
  $('#who').innerHTML='<b>'+esc(S.user.name)+'</b>'+(S.user.team_no?'<span class="tno-inline">No.'+esc(S.user.team_no)+'</span>':'');
  renderNav();
  const tab=qs.get('tab')||'home';
  go(tab);
  if(qs.get('with')){S.chatWith=Number(qs.get('with'));setTimeout(()=>go('messages'),300)}
  refreshUnread();
  setInterval(refreshUnread,25000);
  // 首次自动导入资料（幂等）
  api('seed',{method:'POST',body:{}}).catch(()=>{});
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
async function refreshUnread(){
  try{const d=await api('notifications');S.unread=d.unread||0;renderBadges()}catch(e){}
}
function renderBadges(){
  const b=$('#noticeBtn');
  b.innerHTML=ico('bell',19)+(S.unread?'<span class="badge">'+(S.unread>99?'99+':S.unread)+'</span>':'');
  $('#tabbar').querySelectorAll('[data-tab="notifications"]').forEach(el=>{

function renderNav(){
  const items=TABS.filter(t=>!t.admin||S.user.role==='admin');
  let html='',lastG=null;
  items.forEach(t=>{
    if(t.g&&t.g!==lastG){html+='<div class="grp">'+t.g+'</div>';lastG=t.g}
    html+='<div class="nav-item'+(S.tab===t.k?' on':'')+'" data-tab="'+t.k+'"><span class="ni">'+ico(t.i,17)+'</span>'+t.t+'</div>';
  });
  $('#side').innerHTML=html;
  $('#tabbar').innerHTML=items.filter(t=>['home','platforms','messages','customers','sales','approvals','notifications','logs','docs','todos'].includes(t.k)).map(t=>'<button data-tab="'+t.k+'" class="'+(S.tab===t.k?'on':'')+'">'+ico(t.i,17)+'<span>'+t.t+'</span></button>').join('');
  $('#side').querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>go(el.dataset.tab));
  $('#tabbar').querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>go(el.dataset.tab));
  renderBadges();
}
function go(tab){
  S.tab=tab;
  renderNav();
  $('#main').innerHTML='<div class="boot" style="height:36vh">加载中…</div>';
  const map={home:viewHome,platforms:viewPlatforms,messages:viewMessages,approvals:viewApprovals,notifications:viewNotifications,logs:viewLogs,docs:viewDocs,accounts:viewAccounts,customers:viewCustomers,sales:viewSales,todos:viewTodos,files:viewFiles,news:viewNews,members:viewMembers,invites:viewInvites,settings:viewSettings};
  (map[tab]||viewHome)();
  window.scrollTo({top:0});
  history.replaceState(null,'','/console?tab='+tab);
}

          '<button class="btn sm" data-act="plat-open" data-url="'+esc(p.url)+'">'+ico('expand',13)+'打开</button></div>'+
          '<div style="padding:60px 20px;text-align:center;color:var(--muted)"><div class="small-note">该平台通常禁止被嵌入，点「打开」在新窗口使用。</div></div></div>';

        frame='<div class="plat-view"><div class="plat-bar">'+ico(p.icon||'grid',15)+'<b style="font-size:13px">'+esc(p.name)+'</b><span class="u">'+esc(p.url)+'</span>'+

    activePlatform=activePlatform===el.dataset.plat?null:el.dataset.plat;

  });

async function platformConfig(){
  let cur=[];
  const pcfg=await api('settings').then(d=>d.settings.platforms).catch(()=>'');
  if(pcfg){try{cur=JSON.parse(pcfg)}catch(e){}}
  const list=cur.length?cur:DEFAULT_PLATFORMS;

    '<div class="foot"><button class="btn ghost" id="pc_reset">恢复默认</button><button class="btn" id="pc_add">添加</button></div>',
  sh=>{
    sh.querySelectorAll('[data-plat-del]').forEach(b=>b.onclick=()=>{
      const arr=list.slice();arr.splice(Number(b.dataset.platDel),1);
      savePlatforms(arr);
    });
    sh.querySelector('#pc_reset').onclick=async()=>{
      try{await api('settings',{method:'POST',body:{platforms:''}});closeSheet();activePlatform=null;viewPlatforms()}catch(e){alert(e.message)}
    };
    sh.querySelector('#pc_add').onclick=()=>{
      const name=sh.querySelector('#pc_name').value.trim(),url=sh.querySelector('#pc_url').value.trim();
      if(!name||!/^https?:\/\//.test(url)){alert('请填写名称与合法的 http(s) 地址');return}
      const arr=list.slice();
      arr.push({id:'c'+Date.now(),name,url,icon:sh.querySelector('#pc_icon').value.trim()||'grid',desc:'自定义平台',tag:'自定义',external:sh.querySelector('#pc_ext').checked});
      savePlatforms(arr);
    };
    function savePlatforms(arr){
      api('settings',{method:'POST',body:{platforms:JSON.stringify(arr)}}).then(()=>{closeSheet();activePlatform=null;viewPlatforms()}).catch(e=>alert(e.message));
    }
  });
}

async function viewMessages(){
  try{
    const d=await api('messages'+(S.chatWith?'?with='+S.chatWith:''));
    const peers=d.peers||[];
    const listHtml=peers.length?peers.map(p=>{
      const last=(d.items||[]).filter(m=>(m.from_id===p.id&&m.to_id===S.user.id)||(m.to_id===p.id&&m.from_id===S.user.id)).pop();
      const un=d.unread&&d.unread[p.id]?d.unread[p.id]:0;
      return '<div class="msg-peer'+(S.chatWith===p.id?' on':'')+'" data-peer="'+p.id+'"><span class="avatar">'+esc(initials(p.name))+'</span>'+
        '<div style="min-width:0"><div class="nm">'+esc(p.name)+(un?' <span class="un">'+un+'</span>':'')+'</div>'+
        '<div class="pv">'+(last?esc(last.content):(p.title||'发送消息'))+'</div></div></div>';
    }).join(''):'<div class="small-note" style="padding:18px">暂无同事，去「成员」页添加。</div>';
    let feedHtml='<div class="small-note" style="text-align:center;padding:80px 10px">选择左侧同事开始对话</div>';
    let sendBar='';
    if(S.chatWith){
      const msgs=d.items||[];
      feedHtml=msgs.length?msgs.map(m=>'<div class="mb'+(m.from_id===S.user.id?' me':'')+'"><div><div class="who">'+esc(m.from_name)+'</div><div class="b">'+esc(m.content)+'</div></div></div>').join(''):'<div class="small-note" style="text-align:center;padding:60px 10px">还没有消息，打个招呼吧</div>';
      const peer=peers.find(p=>p.id===S.chatWith);
      sendBar='<div class="msg-hd">'+esc(peer?peer.name:'对话')+'</div><div class="msg-feed" id="msgFeed">'+feedHtml+'</div>'+
        '<div class="msg-in"><textarea id="msgText" placeholder="输入消息…"></textarea><button class="btn" id="msgSend">'+ico('send',15)+'发送</button></div>';
    }
    $('#main').innerHTML=head('站内消息','Messages · 团队内部沟通','<button class="btn sm ghost" data-act="new-message">'+ico('plus',14)+'新对话</button>')+
      '<div class="msg-layout"><div class="msg-list">'+listHtml+'</div><div class="msg-box">'+(sendBar||'<div class="msg-hd">消息</div><div class="msg-feed">'+feedHtml+'</div>')+'</div></div>';
    $('#main').querySelectorAll('[data-peer]').forEach(el=>el.onclick=()=>{S.chatWith=Number(el.dataset.peer);viewMessages()});
    if(S.chatWith){
      const f=$('#msgFeed');if(f)f.scrollTop=f.scrollHeight;
      const ta=$('#msgText');
      const send=async()=>{
        const v=ta.value.trim();if(!v)return;
        try{await api('messages',{method:'POST',body:{to_id:S.chatWith,content:v}});ta.value='';viewMessages()}
        catch(e){alert(e.message)}
      };
      $('#msgSend').onclick=send;
      ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
    }
    bindMain();
  }catch(e){$('#main').innerHTML=errBox(e)}
}

  sh=>{

    sh.querySelector('#fl_save').onclick=async()=>{
      const title=$('#fl_title').value.trim()||'未命名资料';const url=$('#fl_url').value.trim();const file=$('#fl_img').files[0];
      try{
        let body={title,note:$('#fl_note').value,visibility:$('#fl_vis').value};
        if(file)body.dataUrl=await shrinkImage(file);
        else{if(!url)throw new Error('请填链接或选择图片');body.url=url}
        await api('files',{method:'POST',body});closeSheet();go('files');
      }catch(e){alert(e.message)}
    };
  });
}
function shrinkImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const max=1400;let w=img.width,h=img.height;
      if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r)}
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      let q=.82,data=c.toDataURL('image/jpeg',q);
      while(data.length>1100000&&q>.4){q-=.1;data=c.toDataURL('image/jpeg',q)}
      resolve(data);
    };
    img.onerror=()=>reject(new Error('图片读取失败'));
    img.src=URL.createObjectURL(file);
  });
}

/* ---------- 推广海报：canvas 生成 → 保存 PNG，发朋友圈/群 ---------- */
function makePoster(code){
  const c=document.createElement('canvas');c.width=720;c.height=960;const x=c.getContext('2d');
  x.fillStyle='#05070d';x.fillRect(0,0,720,960);
  x.fillStyle='#5b8cff';x.fillRect(36,36,648,888);
  x.fillStyle='#0d1120';x.fillRect(52,52,616,856);
  x.fillStyle='#5b8cff';x.fillRect(52,52,616,10);
  x.fillStyle='#5b8cff';x.font='bold 26px sans-serif';x.fillText('炽云AI · 线上推广合伙人',84,140);
  x.fillStyle='#f4f6fb';x.font='bold 46px sans-serif';
  x.fillText('客户月花 2000',84,230);x.fillText('你首月拿 60',84,292);
  x.font='bold 30px sans-serif';x.fillStyle='#8a93a8';
  x.fillText('之后每个月再拿 30 · 客户一直用你一直拿',84,346);
  x.strokeStyle='rgba(255,255,255,.14)';x.beginPath();x.moveTo(84,386);x.lineTo(636,386);x.stroke();
  x.font='22px sans-serif';x.fillStyle='#f4f6fb';
  const lines=['· 0 投入 0 风险，纯佣金，手机就能干','· 建站单拿 10% · 整机售卖 2%（10万的机器拿2000）','· 公寓 20% / OPC 8%，大单线往上走','· 带人有管道：新势力每挣 4 块，你拿 1 块','· 老合伙人带你上手，教你用 AI 做获客——本事带走'];
  lines.forEach((t,i)=>x.fillText(t,84,436+i*44));
  x.fillStyle='#5b8cff';x.font='bold 20px sans-serif';x.fillText('注册填邀请码',84,720);
  x.fillStyle='#f4f6fb';x.font='bold 56px sans-serif';x.fillText(code||'（生成子码后再来）',84,790);
  x.fillStyle='#8a93a8';x.font='20px sans-serif';x.fillText('注册入口：chiyun-ai.pages.dev/console',84,850);
  x.font='16px sans-serif';x.fillText('佣金以客户实付计 · 月结 · 规则以工作台公示为准',84,884);
  const a=document.createElement('a');a.download='chiyun-推广海报-'+(code||'')+'.png';a.href=c.toDataURL('image/png');a.click();
}

        if(act==='new-log')logForm();

          const fid=Number(el.dataset.id),fname=el.dataset.name||('推广员#'+fid);

        else if(act==='new-message'){S.chatWith=S.chatWith||0;go('messages');if(!S.chatWith)setTimeout(()=>{const p=$('#main').querySelector('[data-peer]');if(p)p.click()},200)}
        else if(act==='msg-to'){S.chatWith=Number(el.dataset.id);go('messages')}
        else if(act==='appr-view'){const r=await api('approvals/'+el.dataset.id);const a=r.item;openSheet('<h3>'+esc(a.title)+'</h3><div class="txt">'+esc(a.content)+'</div><div class="ln"></div><div class="meta">'+esc(a.applicant_name)+' · '+esc(a.kind)+' · '+esc(a.status)+(a.handle_note?' · '+esc(a.handle_note):'')+'</div><div class="foot"><button class="btn ghost" data-close>关闭</button></div>')}
        else if(act==='appr-handle'){
          const note=prompt('处理备注（可留空）：','');
          if(note===null)return;
          await api('approvals/'+el.dataset.id,{method:'PUT',body:{status:el.dataset.status,handle_note:note}});
          go('approvals');
        }
        else if(act==='read-all'){await api('notifications/read',{method:'POST',body:{}});S.unread=0;renderBadges();go('notifications')}
        else if(act==='del-invite'){if(confirm('删除邀请码 '+el.dataset.code+'？删除后立即失效。')){await api('invites/'+el.dataset.code,{method:'DELETE'});go('invites')}}
        else if(act==='reset-pwd')resetPwd(el.dataset.id,el.dataset.name);
        else if(act==='del-news'){if(confirm('删除这条公告？')){await api('announcements/'+el.dataset.id,{method:'DELETE'});go('news')}}
        else if(act==='del'){if(confirm('确认删除？')){await api(el.dataset.kind+'/'+el.dataset.id,{method:'DELETE'});go(S.tab)}}
        else if(act==='cmt')openComments(el.dataset.type,el.dataset.id);
        else if(act==='go-logs')go('logs');
        else if(act==='go-docs'||act==='go-settings')go(act==='go-docs'?'docs':'settings');
        else if(act==='go-accounts')go('accounts');
        else if(act==='go-files')go('files');
        else if(act==='go-news')go('news');
        else if(act==='go-messages')go('messages');
        else if(act==='preview')openSheet('<h3>'+esc(el.dataset.title||'图片')+'</h3><img src="'+esc(el.dataset.url)+'" style="width:100%;border-radius:3px"><div class="foot"><button class="btn ghost" data-close>关闭</button></div>',s=>{s.querySelector('[data-close]').onclick=closeSheet});
      }catch(e){alert(e.message)}
    };
  });
}

boot();
</script>
</body>
</html>
